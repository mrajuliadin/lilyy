<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<title>Untuk Kamu ❤️</title>

<style>
body {
    background: linear-gradient(to right, #b6ff81, #fad0c4);

    padding: 50px;
    color: black;
}

/* biar lebih rapi di HP */
.container {
    max-width: 300px;

}

/* tombol */
a, button {
    display: block;
    margin: 10px auto;
    padding: 12px;
    background: #ff4b5c;
    color: white;
    border-radius: 10px;
    text-decoration: none;
    border: none;
    width: 100%;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="container">
    <h2>Hai Sayang ❤️</h2>
    <p>Kamu siap lihat sesuatu? 😳</p>

    <p id="text"></p>
    <button onclick="gombal()">Klik Aku 💕</button>
</div>

<script>
function gombal(){
    document.getElementById("text").innerHTML =
    "Kamu itu halaman favorit aku...<br>yang selalu pengen aku buka setiap hari ❤️";
}
</script>

</html>
